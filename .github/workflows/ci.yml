name: CI

# The Kafka suite uses a second runner; opt in to it when dispatching the workflow.
on:
  workflow_dispatch:
    inputs:
      run_integration:
        description: Run the Kafka integration suite after unit tests pass
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile, package, and run tests
        run: mvn -B --no-transfer-progress verify

  kafka-integration-tests:
    if: inputs.run_integration
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify Docker availability
        run: docker --version
      - name: Run Kafka integration tests
        run: mvn -B --no-transfer-progress -pl notification-service verify -Pintegration
